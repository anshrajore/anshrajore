<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="760"
     viewBox="0 0 1600 760">

<defs>

  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect id="dummy"/>

  <linearGradient id="bg"
                  x1="0"
                  y1="0"
                  x2="1"
                  y2="1">

    <stop offset="0%" stop-color="#020202"/>
    <stop offset="45%" stop-color="#080808"/>
    <stop offset="100%" stop-color="#020202"/>

  </linearGradient>


  <!-- ===================================================== -->
  <!-- GRID -->
  <!-- ===================================================== -->

  <pattern id="grid"
           width="48"
           height="48"
           patternUnits="userSpaceOnUse">

    <path
      d="M48 0H0V48"
      fill="none"
      stroke="#ffffff"
      stroke-opacity=".035"
      stroke-width="1"/>

  </pattern>


  <pattern id="microGrid"
           width="12"
           height="12"
           patternUnits="userSpaceOnUse">

    <path
      d="M12 0H0V12"
      fill="none"
      stroke="#ffffff"
      stroke-opacity=".012"/>

  </pattern>


  <!-- ===================================================== -->
  <!-- PHOTO -->
  <!-- ===================================================== -->

  <clipPath id="photoClip">

    <rect
      x="1160"
      y="155"
      width="335"
      height="455"
      rx="2"/>

  </clipPath>


  <!-- ===================================================== -->
  <!-- SCANNER -->
  <!-- ===================================================== -->

  <linearGradient
    id="scanGradient"
    x1="0"
    y1="0"
    x2="0"
    y2="1">

    <stop offset="0"
          stop-color="#ffffff"
          stop-opacity="0"/>

    <stop offset=".45"
          stop-color="#ffffff"
          stop-opacity=".02"/>

    <stop offset=".5"
          stop-color="#ffffff"
          stop-opacity=".95"/>

    <stop offset=".55"
          stop-color="#ffffff"
          stop-opacity=".02"/>

    <stop offset="1"
          stop-color="#ffffff"
          stop-opacity="0"/>

  </linearGradient>


  <!-- ===================================================== -->
  <!-- GLOW -->
  <!-- ===================================================== -->

  <filter id="glow">

    <feGaussianBlur
      stdDeviation="4"
      result="blur"/>

    <feMerge>

      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>

    </feMerge>

  </filter>


  <!-- ===================================================== -->
  <!-- PHOTO SHADOW -->
  <!-- ===================================================== -->

  <filter id="shadow">

    <feGaussianBlur
      stdDeviation="18"/>

  </filter>

</defs>


