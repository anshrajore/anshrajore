<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="720"
     viewBox="0 0 1400 720"
     role="img"
     aria-label="Ansh Rajore GitHub analytics">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030303"/>
    <stop offset="55%" stop-color="#090909"/>
    <stop offset="100%" stop-color="#020202"/>
  </linearGradient>

  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0%" stop-color="#777777"/>
    <stop offset="50%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#777777"/>
  </linearGradient>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1400" height="720" rx="18" fill="url(#bg)"/>
<rect width="1400" height="720" fill="url(#grid)"/>

<!-- FRAME -->
<rect x="18" y="18" width="1364" height="684" rx="15"
      fill="none" stroke="#fff" stroke-opacity=".18"/>
<rect x="28" y="28" width="1344" height="664" rx="11"
      fill="none" stroke="#fff" stroke-opacity=".04"/>

<!-- HEADER -->
<rect x="28" y="28" width="1344" height="62" rx="11" fill="#080808"/>

<circle cx="56" cy="59" r="5" fill="#fff"/>
<circle cx="76" cy="59" r="5" fill="#555"/>
<circle cx="96" cy="59" r="5" fill="#222"/>

<text x="130" y="64"
      fill="#fff"
