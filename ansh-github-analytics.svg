      font-size="12"
      letter-spacing="3">
  ANSH.RUNTIME / GITHUB ANALYTICS
</text>

<text x="1185" y="64"
      fill="#666"
      font-family="monospace"
      font-size="9"
      letter-spacing="2">
  ACTIVITY ENGINE
</text>

<circle cx="1165" cy="59" r="3" fill="#fff">
  <animate attributeName="opacity"
