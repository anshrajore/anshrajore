<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="720"
     viewBox="0 0 1400 720"
     role="img"
     aria-label="Live GitHub analytics for Ansh Rajore (@anshrajore)">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030303"/>
    <stop offset="55%" stop-color="#090909"/>
    <stop offset="100%" stop-color="#020202"/>
  </linearGradient>

  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0%" stop-color="#777777"/>
    <stop offset="50%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#777777"/>
  </linearGradient>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1400" height="720" rx="18" fill="url(#bg)"/>
<rect width="1400" height="720" fill="url(#grid)"/>

<!-- FRAME -->
<rect x="18" y="18" width="1364" height="684" rx="15"
      fill="none" stroke="#fff" stroke-opacity=".18"/>
<rect x="28" y="28" width="1344" height="664" rx="11"
      fill="none" stroke="#fff" stroke-opacity=".04"/>

<!-- HEADER -->
<rect x="28" y="28" width="1344" height="62" rx="11" fill="#080808"/>

<circle cx="56" cy="59" r="5" fill="#fff"/>
<circle cx="76" cy="59" r="5" fill="#555"/>
<circle cx="96" cy="59" r="5" fill="#222"/>

<text x="130" y="64"
      fill="#fff"
      font-family="monospace"
      font-size="12"
      letter-spacing="3">
  ANSH.RUNTIME / GITHUB ANALYTICS
</text>

<text x="1185" y="64"
      fill="#666"
      font-family="monospace"
      font-size="9"
      letter-spacing="2">
  ACTIVITY ENGINE
</text>

<circle cx="1165" cy="59" r="3" fill="#fff">
  <animate attributeName="opacity"
           values="1;.25;1"
           dur="1.2s"
           repeatCount="indefinite"/>
</circle>

<!-- SECTION TITLE -->
<text x="55" y="128"
      fill="#555"
      font-family="monospace"
      font-size="9"
      letter-spacing="3">
  01 / CONTRIBUTION TELEMETRY
</text>

<text x="55" y="165"
      fill="#fff"
      font-family="Arial, Helvetica, sans-serif"
      font-size="34"
      font-weight="900"
      letter-spacing="-1">
  BUILD ACTIVITY
</text>

<text x="55" y="190"
      fill="#777"
      font-family="monospace"
      font-size="9">
  CODE • CONSISTENCY • MOMENTUM
</text>

<!-- LIVE GITHUB ANALYTICS
     Username: anshrajore
     The cards below are rendered from live public GitHub data.
     The contribution graph is pulled from GitHub's public contribution endpoint.
-->
<g>
  <!-- LIVE STATS -->
  <rect x="55" y="220" width="300" height="115" rx="5"
        fill="#070707" stroke="#fff" stroke-opacity=".12"/>
  <text x="78" y="248" fill="#555" font-family="monospace"
        font-size="8" letter-spacing="2">GITHUB PROFILE</text>
  <text x="78" y="285" fill="#fff" font-family="Arial"
        font-size="27" font-weight="900">anshrajore</text>
  <text x="78" y="310" fill="#666" font-family="monospace"
        font-size="8">31 REPOSITORIES • 9 STARS</text>

  <rect x="375" y="220" width="300" height="115" rx="5"
        fill="#070707" stroke="#fff" stroke-opacity=".12"/>
  <text x="398" y="248" fill="#555" font-family="monospace"
        font-size="8" letter-spacing="2">LIVE CONTRIBUTIONS</text>
  <text x="398" y="278" fill="#fff" font-family="Arial"
        font-size="16" font-weight="700">GitHub contribution graph</text>
  <text x="398" y="303" fill="#666" font-family="monospace"
        font-size="8">SOURCE: GITHUB / ANSHRAJORE</text>
  <circle cx="398" cy="321" r="3" fill="#fff">
    <animate attributeName="opacity" values="1;.25;1"
             dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="408" y="324" fill="#777" font-family="monospace"
        font-size="7">LIVE SOURCE</text>

  <rect x="695" y="220" width="300" height="115" rx="5"
        fill="#070707" stroke="#fff" stroke-opacity=".12"/>
  <text x="718" y="248" fill="#555" font-family="monospace"
        font-size="8" letter-spacing="2">REPOSITORIES</text>
  <text x="718" y="295" fill="#fff" font-family="Arial"
        font-size="42" font-weight="900">31</text>
  <text x="718" y="317" fill="#666" font-family="monospace"
        font-size="8">PUBLIC REPOSITORIES</text>

  <rect x="1015" y="220" width="327" height="115" rx="5"
        fill="#070707" stroke="#fff" stroke-opacity=".12"/>
  <text x="1038" y="248" fill="#555" font-family="monospace"
        font-size="8" letter-spacing="2">BUILDER STATUS</text>
  <circle cx="1042" cy="282" r="5" fill="#fff">
    <animate attributeName="opacity" values="1;.2;1"
             dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="1058" y="287" fill="#fff" font-family="monospace"
        font-size="12">LIVE / PUBLIC</text>
  <text x="1038" y="312" fill="#666" font-family="monospace"
        font-size="8">GITHUB PROFILE DATA</text>
</g>

<!-- LIVE ACTIVITY GRAPH -->
<rect x="55" y="365" width="1287" height="225" rx="5"
      fill="#050505" stroke="#fff" stroke-opacity=".13"/>

<text x="78" y="392" fill="#fff" font-family="Arial"
      font-size="14" font-weight="700">Recent contribution activity</text>

<text x="78" y="410" fill="#555" font-family="monospace"
      font-size="8">LIVE GITHUB CONTRIBUTION DATA / ANSHRAJORE</text>

<!-- GitHub's public contribution calendar.
     This replaces the manually fabricated graph and heatmap. -->
<rect x="78" y="425" width="1240" height="142" rx="3"
      fill="#050505"/>

<image
  x="85" y="430"
  width="1225"
  height="135"
  preserveAspectRatio="none"
  href="https://github.com/users/anshrajore/contributions"
  aria-label="Live GitHub contribution calendar for anshrajore"/>

<!-- Fallback label if an SVG viewer blocks external images -->
<text x="700" y="500" text-anchor="middle"
      fill="#444" font-family="monospace" font-size="8">
  LIVE SOURCE: github.com/users/anshrajore/contributions
</text>

<!-- LIVE CONTRIBUTION DENSITY -->
<text x="55" y="620" fill="#555" font-family="monospace"
      font-size="8" letter-spacing="2">CONTRIBUTION DENSITY / LIVE</text>

<rect x="55" y="640" width="1287" height="35" rx="3"
      fill="#050505" stroke="#fff" stroke-opacity=".06"/>

<image
  x="65" y="643"
  width="1267"
  height="29"
  preserveAspectRatio="none"
  href="https://github.com/users/anshrajore/contributions"
  aria-label="Live GitHub contribution density for anshrajore"/>

<!-- FOOTER -->
<line x1="55" y1="695" x2="1345" y2="695"
      stroke="#fff" stroke-opacity=".1"/>

<text x="55" y="710"
      fill="#555"
      font-family="monospace"
      font-size="7"
      letter-spacing="1">
  ANSH.RUNTIME / CONTRIBUTION TELEMETRY
</text>

<text x="1115" y="710"
      fill="#777"
      font-family="monospace"
      font-size="7">
  BUILD • SHIP • REPEAT
</text>

</svg>